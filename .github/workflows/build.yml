name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Neuer Push bricht veraltete Läufe ab (sonst gibt es Fehler-Mails zu überholten Ständen)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: macOS-App und DMG bauen
        run: bash scripts/build-release.sh mac
      - uses: actions/upload-artifact@v4
        with:
          name: Anamorphic-macOS-DMG
          path: Ergebnisse/Anamorphic.dmg
      - name: DMG als Release zum direkten Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Ergebnisse/Anamorphic.dmg \
            --title "Anamorphic macOS (Build ${{ github.run_number }})" \
            --notes "Nicht notarisiert: beim ersten Start Rechtsklick auf die App und Öffnen." \
            --prerelease

  ios-ipa:
    needs: macos-dmg
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: iOS-App (unsigniert) bauen
        run: bash scripts/build-release.sh ios
      - uses: actions/upload-artifact@v4
        with:
          name: Anamorphic-iOS-IPA
          path: Ergebnisse/Anamorphic.ipa
      - name: IPA zum selben Release hinzufügen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "build-${{ github.run_number }}" Ergebnisse/Anamorphic.ipa

  core-tests:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        env:
          SAMPLE_DIR: ${{ github.workspace }}/samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beispielbilder
          path: samples
          if-no-files-found: ignore
